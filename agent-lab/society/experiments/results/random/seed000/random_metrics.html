        const canvas = document.getElementById('chart');
        const ctx = canvas.getContext('2d');

        function draw() {
            ctx.clearRect(0, 0, 800, 300);
            const maxProposals = Math.max(...data.map(d => d.alive_proposals), 1);
            const maxTrust = Math.max(...data.map(d => d.avg_trust), 1);

            // Draw proposals line
            ctx.strokeStyle = '#e94560';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i < data.length; i++) {
                const x = (i / (data.length - 1)) * 780 + 10;
                const y = 290 - (data[i].alive_proposals / maxProposals) * 270;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();

            // Draw trust line
            ctx.strokeStyle = '#4ecca3';
            ctx.beginPath();
            for (let i = 0; i < data.length; i++) {
                const x = (i / (data.length - 1)) * 780 + 10;
                const y = 290 - (data[i].avg_trust / maxTrust) * 270;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }
        draw();
